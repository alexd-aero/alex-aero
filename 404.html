<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — ax.</title>
  <link rel="icon" href="/assets/brand/aegis-burrow.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #030304; --ink: #ece7de; --mute: rgba(236,231,222,.6); --faint: rgba(236,231,222,.35); --gold: #d6b45c; --bw: #ff5a3d; color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, sans-serif; overflow: hidden; padding: 24px; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .box { position: relative; text-align: center; max-width: 520px; }
    .code { font: 600 clamp(96px, 22vw, 180px)/.9 "Inter", sans-serif; letter-spacing: -.06em; background: linear-gradient(180deg, #fff 30%, #b9bdc4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .code em { font-style: normal; }
    p { margin-top: 18px; color: var(--mute); font-size: 17px; font-weight: 300; }
    .tag { display: inline-block; margin-top: 22px; font: 12px "JetBrains Mono", monospace; color: var(--faint); padding: 6px 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 99px; }
    .tag b { color: var(--bw); font-weight: 400; }
    a.home { display: inline-flex; gap: 8px; margin-top: 30px; color: var(--ink); text-decoration: none; padding: 13px 22px; border-radius: 99px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.04); transition: background .2s, border-color .2s; }
    a.home:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <main class="box">
    <div class="code">4<em>0</em>4</div>
    <p>This thread came loose. Nothing is woven here.</p>
    <span class="tag" id="tag">GET <b id="path">/</b> → not found</span><br>
    <a class="home" href="/">← Back to the loom</a>
  </main>
  <script>
    document.getElementById("path").textContent = location.pathname.slice(0, 60);
    const cv = document.getElementById("c"), ctx = cv.getContext("2d");
    let W, H, T = [];
    function size() {
      const d = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
      T = Array.from({ length: Math.round(H / 30) }, (_, i) => ({ y: H * (i + .5) / Math.round(H / 30), a: 6 + Math.random() * 16, f: .002 + Math.random() * .003, p: Math.random() * 6, s: Math.random() < .5 ? -1 : 1 }));
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      const cut = W / 2;
      T.forEach((th, i) => {
        ctx.beginPath();
        for (let x = 0; x <= W; x += 14) {
          // the middle thread is broken
          const gap = i === (T.length >> 1) && Math.abs(x - cut) < 90;
          const y = th.y + th.a * Math.sin(x * th.f + t * .0005 * th.s + th.p) + (gap ? (x < cut ? 1 : -1) * Math.pow(1 - Math.abs(x - cut) / 90, 2) * 30 : 0);
          x === 0 || (gap && Math.abs(x - cut) < 14) ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = i === (T.length >> 1) ? "rgba(61,220,151,.55)" : "rgba(236,231,222,.06)";
        ctx.stroke();
      });
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(draw);
    }
    size(); addEventListener("resize", size); requestAnimationFrame(draw);
  </script>
</body>
</html>
