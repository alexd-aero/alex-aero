<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      background: 
#0a0a0a;
      overflow: hidden;
    }
    /* very subtle dark glow blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: 
#ffffff;
      top: -150px; left: -150px;
    }
    body::after {
      width: 500px; height: 500px;
      background: 
#ffffff;
      bottom: -120px; right: -120px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      padding: 3.5rem 4rem;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 300;
      color: 
#f0f0f0;
      letter-spacing: 0.04em;
      min-height: 1.2em;
      min-width: 12ch;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: 
#f0f0f0;
      vertical-align: middle;
      margin-left: 3px;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    p {
      margin-top: 1rem;
      font-size: 0.85rem;
      font-weight: 300;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title"><span class="cursor"></span></h1>
    <p>page</p>
  </div>
  <script>
    const text = 'Hello, World.';
    const el = document.getElementById('title');
    let i = 0;
    let deleting = false;
    function render(str) {
      el.textContent = str;
      const cur = document.createElement('span');
      cur.className = 'cursor';
      el.appendChild(cur);
    }
    function tick() {
      if (!deleting) {
        // typing
        if (i < text.length) {
          render(text.slice(0, ++i));
          setTimeout(tick, 90);
        } else {
          // pause then start deleting
          setTimeout(() => { deleting = true; tick(); }, 1800);
        }
      } else {
        // deleting
        if (i > 0) {
          render(text.slice(0, --i));
          setTimeout(tick, 55);
        } else {
          // pause then start typing again
          deleting = false;
          setTimeout(tick, 600);
        }
      }
    }
    setTimeout(tick, 400);
  </script>
</body>
</html>
